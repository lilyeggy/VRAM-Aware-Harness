name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit / integration tests
        run: bun test ./tests

      - name: Platform concurrency soak
        run: bun run scripts/platform-soak.ts

      - name: Scheduler benchmark (informational)
        run: bun run scripts/scheduler-benchmark.ts
